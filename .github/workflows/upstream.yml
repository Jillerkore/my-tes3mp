name: Upstream

# Once a week, check whether upstream CoreScripts has moved past the commit
# this project pins. If it has, build and boot the server against the new
# commit and, when that works, open a pull request that moves the pin - so an
# upstream fix arrives as a tested, reviewable one-line change, and an
# upstream change that breaks something here shows up as a failed run rather
# than as a broken server.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  corescripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is upstream ahead?
        id: check
        run: |
          set +e
          scripts/bump-corescripts.sh --check
          status=$?
          set -e
          if [ "$status" = 10 ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi

      - name: Move the pin
        if: steps.check.outputs.behind == 'true'
        run: scripts/bump-corescripts.sh | tee bump.txt

      - name: Unit tests against the new scripts
        if: steps.check.outputs.behind == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y luajit
          make test

      - name: Build and boot the server with the new scripts
        if: steps.check.outputs.behind == 'true'
        run: |
          docker compose up -d --build --wait
          docker compose logs --no-color
          ! docker compose logs --no-color | grep -iE 'stack traceback|attempt to (call|index)'
          docker compose down -v

      - name: Open a pull request
        if: steps.check.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(sed -n 's/^ARG CORESCRIPTS_COMMIT=//p' docker/Dockerfile)
          branch="upstream/corescripts-${commit:0:10}"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "A pull request branch for $commit already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docker/Dockerfile
          git commit -m "Update CoreScripts to ${commit:0:10}"
          git push origin "$branch"
          gh pr create --title "Update CoreScripts to ${commit:0:10}" \
            --body "$(printf 'Upstream CoreScripts has new commits. The unit tests pass and the server boots with them.\n\n```\n%s\n```\n' "$(cat bump.txt)")"
