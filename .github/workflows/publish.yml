name: Publish

# Pushes the server image to the GitHub Container Registry:
#   ghcr.io/<owner>/my-tes3mp:latest   on every push to main
#   ghcr.io/<owner>/my-tes3mp:1.2.3    on a v1.2.3 tag
#
# Hosts can then skip the local build by setting, in .env:
#   TES3MP_IMAGE=ghcr.io/<owner>/my-tes3mp:latest
#
# A v1.2.3 tag also becomes a GitHub Release, with that version's section of
# CHANGELOG.md as its notes. Cutting a release is: update VERSION and
# CHANGELOG.md, commit, `git tag v$(cat VERSION)`, push the commit and the tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the VERSION file
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Release notes from the changelog
        run: |
          version=$(cat VERSION)
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          {
            echo
            echo "Server image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$version\`"
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "my-tes3mp $(cat VERSION)" --notes-file notes.md
