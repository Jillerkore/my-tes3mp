name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck my-tes3mp install.sh scripts/*.sh docker/*.sh tests/*.sh
      - name: Compose file is valid
        run: docker compose config --quiet

  test:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run the tests against the pinned CoreScripts
        run: make test

  server:
    name: Build image and boot the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the server and wait until it is healthy
        run: docker compose up -d --build --wait
      - name: Server is listening on UDP 25565
        run: |
          docker compose ps
          sudo ss -lun | grep -q ':25565 '
      - name: Game rules from the environment are loaded
        run: |
          docker compose exec -T server grep -q 'config.shareJournal = false' scripts/custom/myTes3mp/settings.lua
          docker compose exec -T server grep -q 'shareKills' scripts/config.lua
          docker compose logs --no-color | grep -q 'strongholds\] Loaded'
          docker compose logs --no-color | grep -q 'resets\] Loaded'
          docker compose logs --no-color | grep -q 'One in-game day lasts 10 real minutes'
          docker compose logs --no-color | grep -q 'challenge\] Loaded'
          docker compose logs --no-color | grep -q 'vendors\] Merchant gold comes back'
          docker compose logs --no-color | grep -q 'uniques\] Loaded'
          ! docker compose logs --no-color | grep -iE 'stack traceback|attempt to (call|index)'
      - name: Data survives a restart
        run: |
          docker compose exec -T server sh -c 'echo ci > /data/.ci-marker'
          docker compose down
          docker compose up -d --wait
          docker compose exec -T server test -f /data/.ci-marker
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
